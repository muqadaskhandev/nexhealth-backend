# Local development stack: Postgres + the FastAPI backend.
# Production uses AWS RDS instead of this `db` service — point DATABASE_URL at
# the RDS endpoint and run only the `api` container (or your ECS/EKS task).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexhealth
      POSTGRES_PASSWORD: nexhealth
      POSTGRES_DB: nexhealth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexhealth"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      # Override host so the container reaches the db service, not localhost.
      DATABASE_URL: postgresql+asyncpg://nexhealth:nexhealth@db:5432/nexhealth
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
